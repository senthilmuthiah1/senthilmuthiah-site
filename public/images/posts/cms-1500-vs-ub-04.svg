<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">CMS-1500 vs UB-04</title>
  <desc id="d">Two claim forms. CMS-1500 is used by doctors and other professionals and is sent electronically as 837P. UB-04 is used by hospitals and facilities and is sent electronically as 837I.</desc>
  <rect width="720" height="420" fill="#FFFFFF"/>

  <!-- CMS-1500 -->
  <rect x="20" y="20" width="330" height="380" rx="14" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/>
  <text x="185" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="#1F5FBF">CMS-1500</text>
  <text x="185" y="86" text-anchor="middle" font-size="14" fill="#4A5B6B">the "professional" claim</text>
  <!-- icon: person -->
  <circle cx="185" cy="122" r="14" fill="#1F5FBF"/>
  <path d="M160 160 a25 22 0 0 1 50 0z" fill="#1F5FBF"/>
  <text x="44" y="200" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">WHO USES IT</text>
  <text x="44" y="224" font-size="15" fill="#12202E">Doctors, specialists, therapists,</text>
  <text x="44" y="244" font-size="15" fill="#12202E">labs, ambulance, medical suppliers</text>
  <text x="44" y="280" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">BILLS FOR</text>
  <text x="44" y="304" font-size="15" fill="#12202E">The person's work — the visit,</text>
  <text x="44" y="324" font-size="15" fill="#12202E">the test, the procedure</text>
  <rect x="44" y="346" width="282" height="36" rx="18" fill="#FFFFFF" stroke="#DCE2E9"/>
  <text x="185" y="369" text-anchor="middle" font-size="14" font-weight="600" fill="#12202E">Electronic version: 837P</text>

  <!-- UB-04 -->
  <rect x="370" y="20" width="330" height="380" rx="14" fill="#F3F0FA" stroke="#5B47A8" stroke-width="1.5"/>
  <text x="535" y="62" text-anchor="middle" font-size="24" font-weight="700" fill="#5B47A8">UB-04</text>
  <text x="535" y="86" text-anchor="middle" font-size="14" fill="#4A5B6B">the "institutional" claim</text>
  <!-- icon: building -->
  <rect x="512" y="108" width="46" height="52" rx="3" fill="#5B47A8"/>
  <rect x="530" y="96" width="10" height="16" fill="#5B47A8"/>
  <rect x="526" y="100" width="18" height="6" fill="#5B47A8"/>
  <rect x="520" y="118" width="8" height="8" fill="#FFFFFF"/><rect x="542" y="118" width="8" height="8" fill="#FFFFFF"/>
  <rect x="520" y="132" width="8" height="8" fill="#FFFFFF"/><rect x="542" y="132" width="8" height="8" fill="#FFFFFF"/>
  <rect x="530" y="146" width="10" height="14" fill="#FFFFFF"/>
  <text x="394" y="200" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">WHO USES IT</text>
  <text x="394" y="224" font-size="15" fill="#12202E">Hospitals, nursing homes,</text>
  <text x="394" y="244" font-size="15" fill="#12202E">home health, hospice, dialysis</text>
  <text x="394" y="280" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">BILLS FOR</text>
  <text x="394" y="304" font-size="15" fill="#12202E">The building's costs — room,</text>
  <text x="394" y="324" font-size="15" fill="#12202E">nursing, equipment, supplies</text>
  <rect x="394" y="346" width="282" height="36" rx="18" fill="#FFFFFF" stroke="#DCE2E9"/>
  <text x="535" y="369" text-anchor="middle" font-size="14" font-weight="600" fill="#12202E">Electronic version: 837I</text>
</svg>
