<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The three main medical code sets</title>
  <desc id="d">ICD-10 codes answer why: what was wrong, for example R10.10 for upper stomach pain. CPT codes answer what the doctor did, for example 99213 for an office visit. HCPCS codes answer what else was given, for example E0114 for a pair of crutches. The diagnosis code explains why each service was needed.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA8B6"/></marker></defs>
  <rect width="720" height="400" fill="#FFFFFF"/>

  <g>
    <rect x="10" y="20" width="220" height="300" rx="14" fill="#FBF0EC" stroke="#B4462E" stroke-width="1.5"/>
    <text x="120" y="54" text-anchor="middle" font-size="22" font-weight="700" fill="#B4462E">ICD-10</text>
    <text x="120" y="78" text-anchor="middle" font-size="13" fill="#4A5B6B">diagnosis codes</text>
    <text x="120" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">ANSWERS</text>
    <text x="120" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#12202E">Why? What was wrong?</text>
    <text x="120" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">LOOKS LIKE</text>
    <text x="120" y="194" text-anchor="middle" font-size="14" fill="#12202E">a letter + numbers</text>
    <rect x="30" y="218" width="180" height="82" rx="10" fill="#FFFFFF" stroke="#DCE2E9"/>
    <text x="120" y="252" text-anchor="middle" font-size="24" font-weight="700" fill="#12202E" font-family="Consolas, 'Courier New', monospace">R10.10</text>
    <text x="120" y="280" text-anchor="middle" font-size="13" fill="#4A5B6B">upper stomach pain</text>
  </g>

  <g>
    <rect x="250" y="20" width="220" height="300" rx="14" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/>
    <text x="360" y="54" text-anchor="middle" font-size="22" font-weight="700" fill="#1F5FBF">CPT</text>
    <text x="360" y="78" text-anchor="middle" font-size="13" fill="#4A5B6B">procedure codes</text>
    <text x="360" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">ANSWERS</text>
    <text x="360" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#12202E">What did the doctor do?</text>
    <text x="360" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">LOOKS LIKE</text>
    <text x="360" y="194" text-anchor="middle" font-size="14" fill="#12202E">5 numbers</text>
    <rect x="270" y="218" width="180" height="82" rx="10" fill="#FFFFFF" stroke="#DCE2E9"/>
    <text x="360" y="252" text-anchor="middle" font-size="24" font-weight="700" fill="#12202E" font-family="Consolas, 'Courier New', monospace">99213</text>
    <text x="360" y="280" text-anchor="middle" font-size="13" fill="#4A5B6B">office visit</text>
  </g>

  <g>
    <rect x="490" y="20" width="220" height="300" rx="14" fill="#EEF7F1" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="600" y="54" text-anchor="middle" font-size="22" font-weight="700" fill="#2E7D4F">HCPCS</text>
    <text x="600" y="78" text-anchor="middle" font-size="13" fill="#4A5B6B">supply &amp; extra codes</text>
    <text x="600" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">ANSWERS</text>
    <text x="600" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#12202E">What else was given?</text>
    <text x="600" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">LOOKS LIKE</text>
    <text x="600" y="194" text-anchor="middle" font-size="14" fill="#12202E">a letter + 4 numbers</text>
    <rect x="510" y="218" width="180" height="82" rx="10" fill="#FFFFFF" stroke="#DCE2E9"/>
    <text x="600" y="252" text-anchor="middle" font-size="24" font-weight="700" fill="#12202E" font-family="Consolas, 'Courier New', monospace">E0114</text>
    <text x="600" y="280" text-anchor="middle" font-size="13" fill="#4A5B6B">a pair of crutches</text>
  </g>

  <path d="M120 322 V352 H600 V326" stroke="#9AA8B6" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="360" y1="352" x2="360" y2="326" stroke="#9AA8B6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="360" y="380" text-anchor="middle" font-size="13" fill="#4A5B6B">The diagnosis code must explain why each service or supply was needed</text>
</svg>
