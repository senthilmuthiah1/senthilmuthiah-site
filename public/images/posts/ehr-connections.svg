<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How the EHR connects to the rest of healthcare</title>
<desc id="d">The clinic's EHR in the middle, connected to six others: the lab, for orders and results using HL7; the pharmacy, for ePrescriptions through the Surescripts network; other doctors and hospitals, through health information exchanges and TEFCA; the patient, through a portal and apps using FHIR; the billing system, for charges and codes; and the insurer, for eligibility and prior authorization.</desc>
<rect width="720" height="470" fill="#FFFFFF"/>
<line x1="360" y1="235" x2="360.0" y2="70.0" stroke="#C9D2DC" stroke-width="2.5"/>
<line x1="360" y1="235" x2="580.8" y2="152.5" stroke="#C9D2DC" stroke-width="2.5"/>
<line x1="360" y1="235" x2="580.8" y2="317.5" stroke="#C9D2DC" stroke-width="2.5"/>
<line x1="360" y1="235" x2="360.0" y2="400.0" stroke="#C9D2DC" stroke-width="2.5"/>
<line x1="360" y1="235" x2="139.2" y2="317.5" stroke="#C9D2DC" stroke-width="2.5"/>
<line x1="360" y1="235" x2="139.2" y2="152.5" stroke="#C9D2DC" stroke-width="2.5"/>
<circle cx="360" cy="235" r="72" fill="#1F5FBF"/>
<text x="360" y="229" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">EHR</text>
<text x="360" y="251" text-anchor="middle" font-size="12" fill="#FFFFFF">the clinic's</text>
<text x="360" y="266" text-anchor="middle" font-size="12" fill="#FFFFFF">medical record</text>
<rect x="260.0" y="32.0" width="200" height="76" rx="12" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
<text x="360.0" y="57.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D4F">Lab</text>
<text x="360.0" y="76.0" text-anchor="middle" font-size="12.5" fill="#12202E">orders &amp; results</text>
<text x="360.0" y="95.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A5B6B">HL7 messages</text>
<rect x="480.8" y="114.5" width="200" height="76" rx="12" fill="#FFFFFF" stroke="#B8860B" stroke-width="2"/>
<text x="580.8" y="139.5" text-anchor="middle" font-size="14" font-weight="700" fill="#B8860B">Pharmacy</text>
<text x="580.8" y="158.5" text-anchor="middle" font-size="12.5" fill="#12202E">ePrescriptions</text>
<text x="580.8" y="177.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A5B6B">Surescripts · NCPDP</text>
<rect x="480.8" y="279.5" width="200" height="76" rx="12" fill="#FFFFFF" stroke="#5B47A8" stroke-width="2"/>
<text x="580.8" y="304.5" text-anchor="middle" font-size="14" font-weight="700" fill="#5B47A8">Other doctors &amp; hospitals</text>
<text x="580.8" y="323.5" text-anchor="middle" font-size="12.5" fill="#12202E">records &amp; summaries</text>
<text x="580.8" y="342.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A5B6B">HIEs · TEFCA</text>
<rect x="260.0" y="362.0" width="200" height="76" rx="12" fill="#FFFFFF" stroke="#B4462E" stroke-width="2"/>
<text x="360.0" y="387.0" text-anchor="middle" font-size="14" font-weight="700" fill="#B4462E">Insurer</text>
