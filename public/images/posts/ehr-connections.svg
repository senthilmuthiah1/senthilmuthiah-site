<text x="360.0" y="425.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A5B6B">X12 · FHIR APIs</text>
<rect x="39.2" y="279.5" width="200" height="76" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="2"/>
<text x="139.2" y="304.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1F5FBF">Billing system (PMS)</text>
<text x="139.2" y="323.5" text-anchor="middle" font-size="12.5" fill="#12202E">charges &amp; codes</text>
<text x="139.2" y="342.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A5B6B">HL7 / API</text>
<rect x="39.2" y="114.5" width="200" height="76" rx="12" fill="#FFFFFF" stroke="#12202E" stroke-width="2"/>
