<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The same 300 dollar visit, in-network and out-of-network</title>
<desc id="d">In-network: the doctor charges 300 dollars, BlueHealth allows 150, 150 is written off, BlueHealth pays 120 and Anna pays 30. Out-of-network: the doctor charges 300, BlueHealth allows 150 and pays 60 percent, which is 90, Anna pays 40 percent coinsurance, which is 60, and the doctor can bill Anna the remaining 150 as a balance bill. Anna pays 30 in-network but 210 out-of-network.</desc>
<rect width="720" height="360" fill="#FFFFFF"/>
<text x="10" y="26" font-size="16" font-weight="700" fill="#12202E">In-network</text>
<text x="10" y="46" font-size="12.5" fill="#4A5B6B">Contract price $150 · Anna&#x27;s coinsurance 20%</text>
<rect x="10" y="58" width="240.0" height="46" fill="#1F5FBF"/>
<text x="130.0" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">BlueHealth pays</text>
<text x="130.0" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">$120</text>
<rect x="250.0" y="58" width="60.0" height="46" fill="#2E7D4F"/>
<text x="280.0" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Anna</text>
<text x="280.0" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">$30</text>
<rect x="310.0" y="58" width="300.0" height="46" fill="#C9D2DC"/>
<text x="460.0" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#12202E">Written off by the doctor</text>
<text x="460.0" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#12202E">$150</text>
<rect x="618" y="58" width="92" height="46" rx="10" fill="#2E7D4F"/>
<text x="664" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">ANNA PAYS</text>
<text x="664" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">$30</text>
<text x="10" y="156" font-size="16" font-weight="700" fill="#12202E">Out-of-network</text>
<text x="10" y="176" font-size="12.5" fill="#4A5B6B">BlueHealth allows $150 · pays 60% · Anna&#x27;s coinsurance 40% · no contract</text>
<rect x="10" y="188" width="180.0" height="46" fill="#1F5FBF"/>
<text x="100.0" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">BlueHealth pays</text>
<text x="100.0" y="225" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">$90</text>
<rect x="190.0" y="188" width="120.0" height="46" fill="#2E7D4F"/>
<text x="250.0" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Anna 40%</text>
<text x="250.0" y="225" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">$60</text>
<rect x="310.0" y="188" width="300.0" height="46" fill="#B4462E"/>
<text x="460.0" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">Balance bill to Anna</text>
<text x="460.0" y="225" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">$150</text>
<rect x="618" y="188" width="92" height="46" rx="10" fill="#B4462E"/>
<text x="664" y="207" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">ANNA PAYS</text>
<text x="664" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">$210</text>
<line x1="10" y1="290" x2="710" y2="290" stroke="#DCE2E9"/>
<text x="10" y="316" font-size="13" fill="#12202E">Same visit, same $300 charge. In-network, the doctor must write off the difference.</text>
<text x="10" y="338" font-size="13" fill="#12202E">Out-of-network, the doctor can usually bill Anna for it — unless the No Surprises Act applies.</text>
</svg>