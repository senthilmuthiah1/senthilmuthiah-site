<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sample health insurance card, front and back</title>
  <desc id="d">A made-up BlueHealth insurance card. Front: member name, member ID, group number, plan type, copays and effective date. Back: where to send claims, payer ID and phone numbers.</desc>
  <rect width="720" height="300" fill="#FFFFFF"/>
  <text x="180" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">FRONT</text>
  <text x="540" y="20" text-anchor="middle" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">BACK</text>

  <!-- front -->
  <rect x="10" y="32" width="340" height="216" rx="14" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/>
  <rect x="10" y="32" width="340" height="46" rx="14" fill="#1F5FBF"/>
  <rect x="10" y="62" width="340" height="16" fill="#1F5FBF"/>
  <text x="28" y="62" font-size="19" font-weight="700" fill="#FFFFFF">BlueHealth</text>
  <text x="332" y="62" text-anchor="end" font-size="13" font-weight="700" fill="#FFFFFF">PPO PLAN</text>
  <text x="28" y="102" font-size="11" fill="#4A5B6B">MEMBER</text>
  <text x="28" y="119" font-size="15" font-weight="700" fill="#12202E">ANNA SMITH</text>
  <text x="28" y="144" font-size="11" fill="#4A5B6B">MEMBER ID</text>
  <text x="28" y="161" font-size="15" font-weight="700" fill="#12202E" font-family="Consolas, monospace">BHX 482 913 557</text>
  <text x="210" y="144" font-size="11" fill="#4A5B6B">GROUP NO.</text>
  <text x="210" y="161" font-size="15" font-weight="700" fill="#12202E" font-family="Consolas, monospace">004512</text>
  <text x="28" y="188" font-size="11" fill="#4A5B6B">COPAYS</text>
  <text x="28" y="205" font-size="13" fill="#12202E">Doctor $25 · Specialist $50 · ER $250</text>
  <text x="28" y="232" font-size="11" fill="#4A5B6B">EFFECTIVE 01/01/2026</text>

  <!-- back -->
  <rect x="370" y="32" width="340" height="216" rx="14" fill="#F5F7FA" stroke="#DCE2E9" stroke-width="1.5"/>
  <text x="388" y="62" font-size="11" fill="#4A5B6B">SEND PAPER CLAIMS TO</text>
  <text x="388" y="79" font-size="13" fill="#12202E">BlueHealth Claims, PO Box 1000</text>
  <text x="388" y="96" font-size="13" fill="#12202E">Springfield, ST 00000</text>
  <text x="388" y="124" font-size="11" fill="#4A5B6B">ELECTRONIC PAYER ID</text>
  <text x="388" y="141" font-size="15" font-weight="700" fill="#12202E" font-family="Consolas, monospace">BH001</text>
  <text x="388" y="169" font-size="11" fill="#4A5B6B">MEMBER SERVICES</text>
  <text x="388" y="186" font-size="13" fill="#12202E">1-800-000-0000</text>
  <text x="560" y="169" font-size="11" fill="#4A5B6B">PROVIDERS</text>
  <text x="560" y="186" font-size="13" fill="#12202E">1-800-000-0001</text>
  <text x="388" y="226" font-size="11" fill="#4A5B6B">Sample card for illustration only</text>

  <!-- badges -->
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="140" cy="113" r="11" fill="#B4462E"/><text x="140" y="117">1</text>
    <circle cx="112" cy="140" r="11" fill="#B4462E"/><text x="112" y="144">2</text>
    <circle cx="295" cy="155" r="11" fill="#B4462E"/><text x="295" y="159">3</text>
    <circle cx="338" cy="198" r="11" fill="#B4462E"/><text x="338" y="202">4</text>
    <circle cx="690" cy="86" r="11" fill="#B4462E"/><text x="690" y="90">5</text>
    <circle cx="690" cy="136" r="11" fill="#B4462E"/><text x="690" y="140">6</text>
  </g>
  <text x="360" y="284" text-anchor="middle" font-size="13" fill="#4A5B6B">Numbers match the list below the picture</text>
</svg>
