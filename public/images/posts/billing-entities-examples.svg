<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Billing entities in four examples</title>
<desc id="d">A table of four roles on a claim — rendering provider, referring provider, service facility and billing provider — across four examples: a simple visit to Dr. Brown, a specialist visit to Dr. Joe, a lab test at Century Lab, and a visit to Dr. Alex at a clinic owned by GreenPoint Healthcare.</desc>
<rect width="720" height="364" fill="#FFFFFF"/>
<rect x="181.0" y="20" width="127.0" height="48" rx="10" fill="#12202E"/>
<text x="244.5" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA8B6" letter-spacing="1">EXAMPLE 1</text>
<text x="244.5" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Simple visit</text>
<rect x="314.0" y="20" width="127.0" height="48" rx="10" fill="#12202E"/>
<text x="377.5" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA8B6" letter-spacing="1">EXAMPLE 2</text>
<text x="377.5" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Specialist</text>
<rect x="447.0" y="20" width="127.0" height="48" rx="10" fill="#12202E"/>
<text x="510.5" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#9AA8B6" letter-spacing="1">EXAMPLE 3</text>
<text x="510.5" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Lab test</text>
