<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How payment posting works</title>
<desc id="d">Two things arrive: the money, as a bank transfer or check, and the explanation, as an electronic ERA or a paper EOB. A paper EOB can be typed in by hand, or turned into an electronic 835 file by a PDF extractor tool. The billing team matches the payment to the bank deposit, posts each claim line, and then each balance goes one of three ways: closed, sent to the next payer or the patient, or into a work list for denials.</desc>
<rect width="720" height="470" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5B6B"/></marker></defs>
<rect x="10" y="14" width="220" height="64" rx="12" fill="#EEF7F1" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="120.0" y="42.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12202E">THE MONEY</text>
<text x="120.0" y="60.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12202E">Bank transfer (EFT) or check</text>
<rect x="250" y="14" width="220" height="64" rx="12" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/>
<text x="360.0" y="42.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12202E">THE EXPLANATION</text>
<text x="360.0" y="60.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12202E">Electronic ERA (835)</text>
<rect x="490" y="14" width="220" height="64" rx="12" fill="#F5F7FA" stroke="#9AA8B6" stroke-width="1.5"/>
<text x="600.0" y="42.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12202E">OR ON PAPER</text>
<text x="600.0" y="60.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12202E">Paper or PDF EOB</text>
<rect x="490" y="100" width="220" height="56" rx="12" fill="#F3F0FA" stroke="#5B47A8" stroke-width="1.5"/>
<text x="600.0" y="124.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#12202E">PDF extractor tool</text>
<text x="600.0" y="142.0" text-anchor="middle" font-size="12" font-weight="400" fill="#12202E">turns the EOB into an 835</text>
<path d="M600 80 V96" stroke="#4A5B6B" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M490 128 H364 V142" stroke="#4A5B6B" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="600" y="176" text-anchor="middle" font-size="11.5" fill="#4A5B6B">(or type it in by hand)</text>
<path d="M360 80 V142" stroke="#4A5B6B" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M120 80 V160 H244" stroke="#4A5B6B" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="250" y="146" width="220" height="56" rx="12" fill="#12202E" stroke="#12202E" stroke-width="1.5"/>
<text x="360.0" y="170.0" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1 · Match</text>
<text x="360.0" y="188.0" text-anchor="middle" font-size="12" font-weight="400" fill="#FFFFFF">ERA total = bank deposit?</text>
<path d="M360 204 V224" stroke="#4A5B6B" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="250" y="228" width="220" height="56" rx="12" fill="#12202E" stroke="#12202E" stroke-width="1.5"/>
<text x="360.0" y="252.0" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2 · Post each line</text>
<text x="360.0" y="270.0" text-anchor="middle" font-size="12" font-weight="400" fill="#FFFFFF">paid · written off · patient</text>
<path d="M360 286 H360 V306" stroke="#4A5B6B" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M360 306 H120 V326" stroke="#4A5B6B" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M360 306 H600 V326" stroke="#4A5B6B" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M360 306 V326" stroke="#4A5B6B" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="10" y="330" width="220" height="82" rx="12" fill="#EEF7F1" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="120.0" y="367.0" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D4F">Balance $0</text>
<text x="120.0" y="385.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#2E7D4F">Claim closed</text>
<rect x="250" y="330" width="220" height="82" rx="12" fill="#FFF8E6" stroke="#B8860B" stroke-width="1.5"/>
<text x="360.0" y="358.0" text-anchor="middle" font-size="14" font-weight="700" fill="#12202E">Balance left (PR)</text>
<text x="360.0" y="376.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#12202E">→ next insurer</text>
<text x="360.0" y="394.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#12202E">or patient statement</text>
<rect x="490" y="330" width="220" height="82" rx="12" fill="#FBF0EC" stroke="#B4462E" stroke-width="1.5"/>
<text x="600.0" y="358.0" text-anchor="middle" font-size="14" font-weight="700" fill="#12202E">Denied or underpaid</text>
<text x="600.0" y="376.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#12202E">→ work list:</text>
<text x="600.0" y="394.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#12202E">correct, appeal, follow up</text>
<text x="360" y="448" text-anchor="middle" font-size="12.5" fill="#4A5B6B">3 · Every posted batch must add up to the money that actually reached the bank.</text>
</svg>