<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How prior authorization works</title>
<desc id="d">Five steps. The doctor orders an MRI. The office checks whether approval is needed. The office sends a request with the diagnosis and notes. The insurance company reviews it. If approved, it gives an authorization number, the MRI is done, and the number goes on the claim. If denied, the office can appeal or the patient can choose to pay.</desc>
<rect width="720" height="330" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA8B6"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2E7D4F"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B4462E"/></marker></defs>
<rect x="10" y="20" width="150" height="120" rx="12" fill="#F5F7FA" stroke="#5B47A8" stroke-width="1.5"/>
<circle cx="32" cy="44" r="13" fill="#5B47A8"/><text x="32" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
<text x="22" y="84" font-size="15.5" font-weight="700" fill="#12202E">Doctor orders</text>
<text x="22" y="106" font-size="12.5" fill="#4A5B6B">an MRI of Anna&#x27;s</text>
<text x="22" y="124" font-size="12.5" fill="#4A5B6B">knee</text>
<line x1="162" y1="80" x2="186" y2="80" stroke="#9AA8B6" stroke-width="2" marker-end="url(#a)"/>
<rect x="190" y="20" width="150" height="120" rx="12" fill="#F5F7FA" stroke="#1F5FBF" stroke-width="1.5"/>
<circle cx="212" cy="44" r="13" fill="#1F5FBF"/><text x="212" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
<text x="202" y="84" font-size="15.5" font-weight="700" fill="#12202E">Check</text>
<text x="202" y="106" font-size="12.5" fill="#4A5B6B">Does BlueHealth need</text>
<text x="202" y="124" font-size="12.5" fill="#4A5B6B">approval?</text>
<line x1="342" y1="80" x2="366" y2="80" stroke="#9AA8B6" stroke-width="2" marker-end="url(#a)"/>
<rect x="370" y="20" width="150" height="120" rx="12" fill="#F5F7FA" stroke="#1F5FBF" stroke-width="1.5"/>
<circle cx="392" cy="44" r="13" fill="#1F5FBF"/><text x="392" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
<text x="382" y="84" font-size="15.5" font-weight="700" fill="#12202E">Request</text>
<text x="382" y="106" font-size="12.5" fill="#4A5B6B">Send diagnosis,</text>
<text x="382" y="124" font-size="12.5" fill="#4A5B6B">codes and notes</text>
<line x1="522" y1="80" x2="546" y2="80" stroke="#9AA8B6" stroke-width="2" marker-end="url(#a)"/>
<rect x="550" y="20" width="150" height="120" rx="12" fill="#F5F7FA" stroke="#12202E" stroke-width="1.5"/>
<circle cx="572" cy="44" r="13" fill="#12202E"/><text x="572" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
<text x="562" y="84" font-size="15.5" font-weight="700" fill="#12202E">Review</text>
<text x="562" y="106" font-size="12.5" fill="#4A5B6B">BlueHealth decides</text>
<path d="M595.0 142 V200 H235.0 V216" stroke="#2E7D4F" stroke-width="2" fill="none" marker-end="url(#g)"/>
<path d="M655.0 142 V216" stroke="#B4462E" stroke-width="2" fill="none" marker-end="url(#r)"/>
<rect x="10" y="220" width="470" height="96" rx="12" fill="#EEF7F1" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="26" y="248" font-size="13" font-weight="700" fill="#2E7D4F" letter-spacing="1">APPROVED</text>
<text x="26" y="272" font-size="14" fill="#12202E">Authorization number:</text>
<text x="186" y="272" font-size="14" font-weight="700" fill="#12202E" font-family="Consolas, monospace">BH-PA-77812</text>
<text x="26" y="296" font-size="13" fill="#4A5B6B">MRI done within 30 days → number goes on the claim</text>
<rect x="500" y="220" width="210" height="96" rx="12" fill="#FBF0EC" stroke="#B4462E" stroke-width="1.5"/>
<text x="516" y="248" font-size="13" font-weight="700" fill="#B4462E" letter-spacing="1">DENIED</text>
<text x="516" y="272" font-size="13" fill="#12202E">Appeal, try another test,</text>
<text x="516" y="292" font-size="13" fill="#12202E">or patient agrees to pay</text>
</svg>