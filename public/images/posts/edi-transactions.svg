<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Healthcare EDI transactions in the order they happen</title>
<desc id="d">Messages between the clinic and the insurance company. Before the visit: 270 eligibility question and 271 answer; 278 authorization request and response. After the visit: 837 claim; TA1 and 999 file acknowledgements; 277CA claim acknowledgement; 276 claim status question and 277 answer; and finally the 835 payment details.</desc>
<rect width="720" height="640" fill="#FFFFFF"/>
<defs><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F5FBF"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2E7D4F"/></marker></defs>
<rect x="10" y="12" width="220" height="44" rx="12" fill="#1F5FBF"/>
<text x="120" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Clinic</text>
<line x1="120" y1="60" x2="120" y2="630" stroke="#DCE2E9" stroke-width="2" stroke-dasharray="4 5"/>
<rect x="490" y="12" width="220" height="44" rx="12" fill="#2E7D4F"/>
<text x="600" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Insurance company</text>
<line x1="600" y1="60" x2="600" y2="630" stroke="#DCE2E9" stroke-width="2" stroke-dasharray="4 5"/>
<text x="360.0" y="40" text-anchor="middle" font-size="11.5" fill="#4A5B6B">via the clearinghouse</text>
<rect x="10" y="80" width="700" height="26" rx="13" fill="#F5F7FA"/>
<text x="360" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#4A5B6B" letter-spacing="1.5">BEFORE THE VISIT</text>
<line x1="126" y1="136" x2="592" y2="136" stroke="#1F5FBF" stroke-width="2.2" marker-end="url(#b)"/>
<rect x="210.0" y="108" width="300" height="22" rx="6" fill="#FFFFFF"/>
<text x="222.0" y="124" font-size="14" font-weight="700" fill="#1F5FBF" font-family="Consolas, 'Courier New', monospace">270</text>
<text x="320.0" y="124" font-size="12.5" fill="#12202E">Is the patient covered?</text>
<line x1="594" y1="182" x2="128" y2="182" stroke="#2E7D4F" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="210.0" y="154" width="300" height="22" rx="6" fill="#FFFFFF"/>
<text x="222.0" y="170" font-size="14" font-weight="700" fill="#2E7D4F" font-family="Consolas, 'Courier New', monospace">271</text>
<text x="320.0" y="170" font-size="12.5" fill="#12202E">Yes — copay, deductible, coinsurance…</text>
<line x1="126" y1="228" x2="592" y2="228" stroke="#1F5FBF" stroke-width="2.2" marker-end="url(#b)"/>
<rect x="210.0" y="200" width="300" height="22" rx="6" fill="#FFFFFF"/>
<text x="222.0" y="216" font-size="14" font-weight="700" fill="#1F5FBF" font-family="Consolas, 'Courier New', monospace">278</text>
<text x="320.0" y="216" font-size="12.5" fill="#12202E">May we do this MRI?</text>
<line x1="594" y1="274" x2="128" y2="274" stroke="#2E7D4F" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="210.0" y="246" width="300" height="22" rx="6" fill="#FFFFFF"/>
<text x="222.0" y="262" font-size="14" font-weight="700" fill="#2E7D4F" font-family="Consolas, 'Courier New', monospace">278</text>
<text x="320.0" y="262" font-size="12.5" fill="#12202E">Approved — authorization number</text>
<rect x="10" y="304" width="700" height="26" rx="13" fill="#F5F7FA"/>
<text x="360" y="321" text-anchor="middle" font-size="12" font-weight="700" fill="#4A5B6B" letter-spacing="1.5">AFTER THE VISIT</text>
<line x1="126" y1="360" x2="592" y2="360" stroke="#1F5FBF" stroke-width="2.2" marker-end="url(#b)"/>
<rect x="210.0" y="332" width="300" height="22" rx="6" fill="#FFFFFF"/>
<text x="222.0" y="348" font-size="14" font-weight="700" fill="#1F5FBF" font-family="Consolas, 'Courier New', monospace">837</text>
<text x="320.0" y="348" font-size="12.5" fill="#12202E">Here is the claim</text>
<line x1="594" y1="406" x2="128" y2="406" stroke="#2E7D4F" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="210.0" y="378" width="300" height="22" rx="6" fill="#FFFFFF"/>
<text x="222.0" y="394" font-size="14" font-weight="700" fill="#2E7D4F" font-family="Consolas, 'Courier New', monospace">TA1 · 999</text>
<text x="320.0" y="394" font-size="12.5" fill="#12202E">File received and readable</text>
<line x1="594" y1="452" x2="128" y2="452" stroke="#2E7D4F" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="210.0" y="424" width="300" height="22" rx="6" fill="#FFFFFF"/>
<text x="222.0" y="440" font-size="14" font-weight="700" fill="#2E7D4F" font-family="Consolas, 'Courier New', monospace">277CA</text>
<text x="320.0" y="440" font-size="12.5" fill="#12202E">Each claim accepted — or rejected</text>
<line x1="126" y1="498" x2="592" y2="498" stroke="#1F5FBF" stroke-width="2.2" marker-end="url(#b)"/>
<rect x="210.0" y="470" width="300" height="22" rx="6" fill="#FFFFFF"/>
<text x="222.0" y="486" font-size="14" font-weight="700" fill="#1F5FBF" font-family="Consolas, 'Courier New', monospace">276</text>
<text x="320.0" y="486" font-size="12.5" fill="#12202E">Where is my claim?</text>
<line x1="594" y1="544" x2="128" y2="544" stroke="#2E7D4F" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="210.0" y="516" width="300" height="22" rx="6" fill="#FFFFFF"/>
<text x="222.0" y="532" font-size="14" font-weight="700" fill="#2E7D4F" font-family="Consolas, 'Courier New', monospace">277</text>
<text x="320.0" y="532" font-size="12.5" fill="#12202E">Still processing / paid / denied</text>
<line x1="594" y1="590" x2="128" y2="590" stroke="#2E7D4F" stroke-width="2.2" marker-end="url(#g)"/>
<rect x="210.0" y="562" width="300" height="22" rx="6" fill="#FFFFFF"/>
<text x="222.0" y="578" font-size="14" font-weight="700" fill="#2E7D4F" font-family="Consolas, 'Courier New', monospace">835</text>
<text x="320.0" y="578" font-size="12.5" fill="#12202E">Payment details (the ERA)</text>
</svg>