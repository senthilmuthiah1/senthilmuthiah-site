<text x="292" y="235" text-anchor="middle" font-size="12.5" font-weight="700" fill="#12202E">Medicare</text>
<rect x="247" y="287" width="90" height="36" rx="8" fill="#EEF7F1" stroke="#2E7D4F"/>
<text x="292" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#12202E">Medicaid</text>
