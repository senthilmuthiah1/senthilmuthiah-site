<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sending claims without and with a clearinghouse</title>
<desc id="d">Left: without a clearinghouse, three clinics each connect separately to four insurance companies, making twelve connections. Right: with a clearinghouse, each clinic has one connection to the clearinghouse, which connects to all four insurance companies.</desc>
