<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 630" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Sample CMS-1500 claim form with dummy data</title><desc id="d">A simplified CMS-1500 professional claim for a made-up patient, Anna Smith, seen by Dr. Emily Lee for a sore throat. Shows the main numbered boxes: insurance, patient and insured details, diagnosis, two service lines and the billing provider.</desc>
