<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#12202E">Getting a new doctor ready to bill insurance</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#4A5B6B">Example: Dr. Sara Khan joins Lee Family Clinic (dummy data)</text>

  <!-- Steps -->
  <g font-size="14">
    <rect x="30" y="90" width="190" height="120" rx="12" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="2"/>
    <text x="125" y="118" text-anchor="middle" font-weight="700" fill="#1F5FBF">1. Collect documents</text>
    <text x="125" y="144" text-anchor="middle" fill="#12202E">License, NPI, training,</text>
    <text x="125" y="164" text-anchor="middle" fill="#12202E">malpractice, DEA</text>
    <text x="125" y="190" text-anchor="middle" fill="#4A5B6B">Fill in CAQH profile</text>

    <rect x="250" y="90" width="190" height="120" rx="12" fill="#EFECF8" stroke="#5B47A8" stroke-width="2"/>
    <text x="345" y="118" text-anchor="middle" font-weight="700" fill="#5B47A8">2. Credentialing</text>
    <text x="345" y="144" text-anchor="middle" fill="#12202E">Each insurer checks:</text>
    <text x="345" y="164" text-anchor="middle" fill="#12202E">is she qualified?</text>
    <text x="345" y="190" text-anchor="middle" fill="#4A5B6B">Often 60 to 120 days</text>

    <rect x="470" y="90" width="190" height="120" rx="12" fill="#FBF4E2" stroke="#B8860B" stroke-width="2"/>
    <text x="565" y="118" text-anchor="middle" font-weight="700" fill="#B8860B">3. Enrollment</text>
    <text x="565" y="144" text-anchor="middle" fill="#12202E">Contract, provider ID,</text>
    <text x="565" y="164" text-anchor="middle" fill="#12202E">linked to the clinic</text>
    <text x="565" y="190" text-anchor="middle" fill="#4A5B6B">Gets an effective date</text>

    <rect x="690" y="90" width="180" height="120" rx="12" fill="#E8F3EC" stroke="#2E7D4F" stroke-width="2"/>
    <text x="780" y="118" text-anchor="middle" font-weight="700" fill="#2E7D4F">4. Bill claims</text>
    <text x="780" y="144" text-anchor="middle" fill="#12202E">Paid for visits on or</text>
    <text x="780" y="164" text-anchor="middle" fill="#12202E">after the effective date</text>
    <text x="780" y="190" text-anchor="middle" fill="#4A5B6B">Release held claims</text>
  </g>
  <g stroke="#4A5B6B" stroke-width="2" fill="#4A5B6B">
    <line x1="222" y1="150" x2="242" y2="150"/><polygon points="242,145 250,150 242,155"/>
    <line x1="442" y1="150" x2="462" y2="150"/><polygon points="462,145 470,150 462,155"/>
    <line x1="662" y1="150" x2="682" y2="150"/><polygon points="682,145 690,150 682,155"/>
  </g>

  <!-- Timeline -->
  <text x="30" y="262" font-size="16" font-weight="700" fill="#12202E">Why the effective date matters (BlueHealth example)</text>
  <line x1="60" y1="320" x2="840" y2="320" stroke="#4A5B6B" stroke-width="2"/>
  <rect x="200" y="300" width="300" height="40" fill="#F6E3DE" stroke="#B4462E"/>
  <text x="350" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#B4462E">Visits here are not paid</text>
  <rect x="500" y="300" width="340" height="40" fill="#E8F3EC" stroke="#2E7D4F"/>
  <text x="670" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D4F">Visits here are paid</text>
  <circle cx="200" cy="320" r="6" fill="#12202E"/>
  <text x="200" y="362" text-anchor="middle" font-size="13" fill="#12202E">1 March</text>
  <text x="200" y="380" text-anchor="middle" font-size="13" fill="#4A5B6B">first day seeing patients</text>
  <circle cx="500" cy="320" r="6" fill="#12202E"/>
  <text x="500" y="362" text-anchor="middle" font-size="13" fill="#12202E">15 April</text>
  <text x="500" y="380" text-anchor="middle" font-size="13" fill="#4A5B6B">effective date</text>

  <!-- Keep current -->
  <text x="30" y="428" font-size="16" font-weight="700" fill="#12202E">After enrollment: keep three clocks running</text>
  <g font-size="14">
    <rect x="30" y="444" width="260" height="56" rx="10" fill="#EAF1FB" stroke="#1F5FBF"/>
    <text x="160" y="468" text-anchor="middle" font-weight="700" fill="#1F5FBF">CAQH re-attest</text>
    <text x="160" y="488" text-anchor="middle" fill="#12202E">every 120 days</text>
    <rect x="320" y="444" width="260" height="56" rx="10" fill="#EFECF8" stroke="#5B47A8"/>
    <text x="450" y="468" text-anchor="middle" font-weight="700" fill="#5B47A8">Re-credentialing</text>
    <text x="450" y="488" text-anchor="middle" fill="#12202E">usually every 36 months</text>
    <rect x="610" y="444" width="260" height="56" rx="10" fill="#FBF4E2" stroke="#B8860B"/>
    <text x="740" y="468" text-anchor="middle" font-weight="700" fill="#B8860B">Medicare revalidation</text>
    <text x="740" y="488" text-anchor="middle" fill="#12202E">about every 5 years</text>
  </g>
</svg>
