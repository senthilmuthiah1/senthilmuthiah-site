<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Claim life cycle at the insurance company</title>
<desc id="d">Eight stages inside the insurance company: 1 the claim arrives from the clearinghouse, 2 front-door check of codes, 3 initial review for duplicates and deadline, 4 member check, 5 network check and pricing, 6 benefits and cost share, 7 medical necessity, 8 final review, then payment and the explanation of benefits.</desc>
<rect width="720" height="420" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5B6B"/></marker></defs>
<rect x="10" y="16" width="165" height="120" rx="12" fill="#F3F0FA" stroke="#5B47A8" stroke-width="1.5"/>
<circle cx="32" cy="40" r="13" fill="#5B47A8"/><text x="32" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
<text x="22" y="78" font-size="14.5" font-weight="700" fill="#12202E">Claim arrives</text>
<text x="22" y="100" font-size="12" fill="#4A5B6B">From the clearinghouse</text>
<path d="M176 76.0 H185" stroke="#4A5B6B" stroke-width="2" marker-end="url(#a)"/>
<rect x="188" y="16" width="165" height="120" rx="12" fill="#F3F0FA" stroke="#5B47A8" stroke-width="1.5"/>
<circle cx="210" cy="40" r="13" fill="#5B47A8"/><text x="210" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
<text x="200" y="78" font-size="14.5" font-weight="700" fill="#12202E">Front-door check</text>
<text x="200" y="100" font-size="12" fill="#4A5B6B">Valid diagnosis, procedure</text>
<text x="200" y="117" font-size="12" fill="#4A5B6B">and modifier?</text>
<path d="M354 76.0 H363" stroke="#4A5B6B" stroke-width="2" marker-end="url(#a)"/>
<rect x="366" y="16" width="165" height="120" rx="12" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/>
<circle cx="388" cy="40" r="13" fill="#1F5FBF"/><text x="388" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
<text x="378" y="78" font-size="14.5" font-weight="700" fill="#12202E">Initial review</text>
<text x="378" y="100" font-size="12" fill="#4A5B6B">A duplicate?</text>
<text x="378" y="117" font-size="12" fill="#4A5B6B">Within the deadline?</text>
<path d="M532 76.0 H541" stroke="#4A5B6B" stroke-width="2" marker-end="url(#a)"/>
<rect x="544" y="16" width="165" height="120" rx="12" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/>
<circle cx="566" cy="40" r="13" fill="#1F5FBF"/><text x="566" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
<text x="556" y="78" font-size="14.5" font-weight="700" fill="#12202E">Member check</text>
<text x="556" y="100" font-size="12" fill="#4A5B6B">Member found?</text>
<text x="556" y="117" font-size="12" fill="#4A5B6B">Plan active that day?</text>
<path d="M626.5 138 V166" stroke="#4A5B6B" stroke-width="2" marker-end="url(#a)"/>
<rect x="544" y="170" width="165" height="120" rx="12" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/>
<circle cx="566" cy="194" r="13" fill="#1F5FBF"/><text x="566" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
<text x="556" y="232" font-size="14.5" font-weight="700" fill="#12202E">Network &amp; price</text>
<text x="556" y="254" font-size="12" fill="#4A5B6B">In-network?</text>
<text x="556" y="271" font-size="12" fill="#4A5B6B">Apply the agreed price</text>
<path d="M543 230.0 H534" stroke="#4A5B6B" stroke-width="2" marker-end="url(#a)"/>
<rect x="366" y="170" width="165" height="120" rx="12" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/>
<circle cx="388" cy="194" r="13" fill="#1F5FBF"/><text x="388" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">6</text>
<text x="378" y="232" font-size="14.5" font-weight="700" fill="#12202E">Benefits</text>
<text x="378" y="254" font-size="12" fill="#4A5B6B">Service covered?</text>
<text x="378" y="271" font-size="12" fill="#4A5B6B">Patient&#x27;s share?</text>
<path d="M365 230.0 H356" stroke="#4A5B6B" stroke-width="2" marker-end="url(#a)"/>
<rect x="188" y="170" width="165" height="120" rx="12" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/>
<circle cx="210" cy="194" r="13" fill="#1F5FBF"/><text x="210" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">7</text>
<text x="200" y="232" font-size="14.5" font-weight="700" fill="#12202E">Medical necessity</text>
<text x="200" y="254" font-size="12" fill="#4A5B6B">Does the diagnosis</text>
<text x="200" y="271" font-size="12" fill="#4A5B6B">justify the service?</text>
<path d="M187 230.0 H178" stroke="#4A5B6B" stroke-width="2" marker-end="url(#a)"/>
<rect x="10" y="170" width="165" height="120" rx="12" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/>
<circle cx="32" cy="194" r="13" fill="#1F5FBF"/><text x="32" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">8</text>
<text x="22" y="232" font-size="14.5" font-weight="700" fill="#12202E">Final review</text>
<text x="22" y="254" font-size="12" fill="#4A5B6B">Everything accurate?</text>
<text x="22" y="271" font-size="12" fill="#4A5B6B">Any sign of fraud?</text>
<text x="270.5" y="154" text-anchor="middle" font-size="11.5" font-weight="700" fill="#B8860B">fails → claim rejected (277CA)</text>
<path d="M92.5 292 V320" stroke="#4A5B6B" stroke-width="2" marker-end="url(#a)"/>
<rect x="10" y="324" width="700" height="82" rx="12" fill="#EEF7F1" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="30" y="354" font-size="13" font-weight="700" fill="#2E7D4F" letter-spacing="1">RESULT</text>
<text x="30" y="378" font-size="14" fill="#12202E">Paid, partly paid or denied. Money goes straight to the provider's bank.</text>
<text x="30" y="400" font-size="14" fill="#12202E">The EOB / 835 goes to the provider; an EOB goes to the patient.</text>
</svg>