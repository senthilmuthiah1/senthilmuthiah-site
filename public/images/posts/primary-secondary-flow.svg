<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How a claim moves from primary to secondary insurance</title>
  <desc id="d">Dr. Lee bills 150 dollars. The primary insurer, BlueHealth, allows 100 dollars and pays 80. The remaining 20 is billed to the secondary insurer, StarCare, together with BlueHealth's payment details. StarCare pays 20, so Anna owes nothing.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9AA8B6"/></marker>
  </defs>
  <rect width="720" height="360" fill="#FFFFFF"/>

  <!-- step cards -->
  <g>
    <rect x="10" y="20" width="160" height="150" rx="12" fill="#F5F7FA" stroke="#12202E" stroke-width="1.5"/>
    <text x="90" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">CLAIM 1</text>
    <text x="90" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E">Dr. Lee bills</text>
    <text x="90" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E">BlueHealth</text>
    <text x="90" y="148" text-anchor="middle" font-size="26" font-weight="700" fill="#12202E">$150</text>
  </g>
  <line x1="172" y1="95" x2="200" y2="95" stroke="#9AA8B6" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="204" y="20" width="160" height="150" rx="12" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/>
    <text x="284" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#1F5FBF" letter-spacing="1">PRIMARY</text>
    <text x="284" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E">BlueHealth</text>
    <text x="284" y="104" text-anchor="middle" font-size="13" fill="#4A5B6B">allows $100, pays</text>
    <text x="284" y="148" text-anchor="middle" font-size="26" font-weight="700" fill="#1F5FBF">$80</text>
  </g>
  <line x1="366" y1="95" x2="394" y2="95" stroke="#9AA8B6" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="398" y="20" width="160" height="150" rx="12" fill="#F3F0FA" stroke="#5B47A8" stroke-width="1.5"/>
    <text x="478" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#5B47A8" letter-spacing="1">SECONDARY</text>
    <text x="478" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E">StarCare</text>
    <text x="478" y="104" text-anchor="middle" font-size="13" fill="#4A5B6B">gets claim 2, pays</text>
    <text x="478" y="148" text-anchor="middle" font-size="26" font-weight="700" fill="#5B47A8">$20</text>
  </g>
  <line x1="560" y1="95" x2="588" y2="95" stroke="#9AA8B6" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="592" y="20" width="118" height="150" rx="12" fill="#EEF7F1" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="651" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D4F" letter-spacing="1">PATIENT</text>
    <text x="651" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E">Anna</text>
    <text x="651" y="104" text-anchor="middle" font-size="13" fill="#4A5B6B">owes</text>
    <text x="651" y="148" text-anchor="middle" font-size="26" font-weight="700" fill="#2E7D4F">$0</text>
  </g>

  <!-- claim 2 note -->
  <path d="M284 172 V205 H478 V176" stroke="#5B47A8" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="381" y="225" text-anchor="middle" font-size="12.5" fill="#5B47A8">Claim 2 carries BlueHealth's payment details</text>

  <!-- money bar -->
  <text x="10" y="270" font-size="13" font-weight="700" fill="#4A5B6B" letter-spacing="1">WHERE THE $150 GOES</text>
  <rect x="10" y="282" width="233" height="40" fill="#DCE2E9"/>
  <rect x="243" y="282" width="373" height="40" fill="#1F5FBF"/>
  <rect x="616" y="282" width="94" height="40" fill="#5B47A8"/>
  <text x="126" y="307" text-anchor="middle" font-size="13" font-weight="700" fill="#12202E">$50 written off</text>
  <text x="429" y="307" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">$80 paid by primary</text>
  <text x="663" y="307" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">$20</text>
  <text x="10" y="344" font-size="12" fill="#4A5B6B">The write-off is the difference between Dr. Lee's price and BlueHealth's agreed (allowed) amount.</text>
</svg>
