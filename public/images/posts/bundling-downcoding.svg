<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="Manrope, 'Segoe UI', system-ui, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Bundling, unbundling, downcoding and upcoding</title>
<desc id="d">Four panels. Bundling: a small service is included in another, so it is not paid separately. Unbundling: billing the parts of a package separately to get paid more — not allowed. Downcoding: the insurer pays for a lower-level code than the one billed, for example 99214 paid as 99213. Upcoding: billing a higher-level code than the notes support — not allowed.</desc>
<rect width="720" height="380" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4A5B6B"/></marker></defs>
<rect x="10" y="10" width="340" height="176" rx="14" fill="#EEF3FB" stroke="#1F5FBF" stroke-width="1.5"/>
<text x="28" y="40" font-size="16" font-weight="700" fill="#1F5FBF">Bundling</text>
<text x="28" y="60" font-size="12.5" fill="#4A5B6B">Insurer: &quot;this is included&quot;</text>
<rect x="370" y="10" width="340" height="176" rx="14" fill="#FBF0EC" stroke="#B4462E" stroke-width="1.5"/>
<text x="388" y="40" font-size="16" font-weight="700" fill="#B4462E">Unbundling</text>
<text x="388" y="60" font-size="12.5" fill="#4A5B6B">Billing parts separately — not allowed</text>
<rect x="10" y="196" width="340" height="176" rx="14" fill="#FFF8E6" stroke="#B8860B" stroke-width="1.5"/>
<text x="28" y="226" font-size="16" font-weight="700" fill="#B8860B">Downcoding</text>
<text x="28" y="246" font-size="12.5" fill="#4A5B6B">Insurer pays a lower level</text>
<rect x="370" y="196" width="340" height="176" rx="14" fill="#FBF0EC" stroke="#B4462E" stroke-width="1.5"/>
<text x="388" y="226" font-size="16" font-weight="700" fill="#B4462E">Upcoding</text>
<text x="388" y="246" font-size="12.5" fill="#4A5B6B">Billing a higher level — not allowed</text>
<rect x="28" y="74" width="140" height="46" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/>
<text x="98.0" y="97" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E" font-family="Consolas, 'Courier New', monospace">17110</text>
<text x="98.0" y="113" text-anchor="middle" font-size="11" fill="#4A5B6B">wart removal</text>
<rect x="28" y="128" width="140" height="46" rx="8" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.5"/>
<text x="98.0" y="151" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E" font-family="Consolas, 'Courier New', monospace">99213</text>
<text x="98.0" y="167" text-anchor="middle" font-size="11" fill="#4A5B6B">short check</text>
<line x1="36" y1="146" x2="160" y2="146" stroke="#B4462E" stroke-width="2.5"/>
<path d="M172 120 H206" stroke="#4A5B6B" stroke-width="2" marker-end="url(#a)"/>
<text x="214" y="112" font-size="12.5" font-weight="700" fill="#12202E">Paid: 17110</text>
<text x="214" y="130" font-size="12" fill="#4A5B6B">The check is part</text>
<text x="214" y="146" font-size="12" fill="#4A5B6B">of the procedure</text>
<rect x="388" y="74" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#B4462E" stroke-width="1.5"/>
<text x="436.0" y="97" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E" font-family="Consolas, 'Courier New', monospace">82947</text>
<text x="436.0" y="113" text-anchor="middle" font-size="11" fill="#4A5B6B">glucose</text>
<rect x="388" y="128" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#B4462E" stroke-width="1.5"/>
<text x="436.0" y="151" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E" font-family="Consolas, 'Courier New', monospace">82565</text>
<text x="436.0" y="167" text-anchor="middle" font-size="11" fill="#4A5B6B">creatinine</text>
<text x="494" y="126" font-size="18" font-weight="700" fill="#4A5B6B">+ …</text>
<path d="M532 120 H566" stroke="#4A5B6B" stroke-width="2" marker-end="url(#a)"/>
<rect x="572" y="98" width="120" height="46" rx="8" fill="#EEF7F1" stroke="#2E7D4F" stroke-width="1.5"/>
<text x="632.0" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E" font-family="Consolas, 'Courier New', monospace">80053</text>
<text x="632.0" y="137" text-anchor="middle" font-size="11" fill="#4A5B6B">the panel code</text>
<text x="572" y="166" font-size="11.5" fill="#2E7D4F" font-weight="700">Bill the panel instead</text>
<rect x="28" y="266" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#B8860B" stroke-width="1.5"/>
<text x="88.0" y="289" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E" font-family="Consolas, 'Courier New', monospace">99214</text>
<text x="88.0" y="305" text-anchor="middle" font-size="11" fill="#4A5B6B">billed</text>
<path d="M152 289 H186" stroke="#4A5B6B" stroke-width="2" marker-end="url(#a)"/>
<rect x="192" y="266" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#B8860B" stroke-width="1.5"/>
<text x="252.0" y="289" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E" font-family="Consolas, 'Courier New', monospace">99213</text>
<text x="252.0" y="305" text-anchor="middle" font-size="11" fill="#4A5B6B">paid as</text>
<text x="28" y="344" font-size="12" fill="#4A5B6B">If the notes support 99214 → appeal</text>
<rect x="388" y="266" width="120" height="46" rx="8" fill="#FFFFFF" stroke="#B4462E" stroke-width="1.5"/>
<text x="448.0" y="289" text-anchor="middle" font-size="15" font-weight="700" fill="#12202E" font-family="Consolas, 'Courier New', monospace">99215</text>
<text x="448.0" y="305" text-anchor="middle" font-size="11" fill="#4A5B6B">billed</text>
<text x="522" y="286" font-size="12.5" font-weight="700" fill="#12202E">Notes support</text>
<text x="522" y="304" font-size="12.5" font-weight="700" fill="#12202E">only 99213</text>
<text x="388" y="344" font-size="12" fill="#4A5B6B">Can be treated as fraud</text>
</svg>