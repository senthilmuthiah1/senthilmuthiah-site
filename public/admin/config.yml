# Decap CMS settings — the online editor at /admin
backend:
  name: github
  repo: senthilmuthiah1/senthilmuthiah-site
  branch: master
  base_url: https://senthilmuthiah.com              # login helper lives on your own site
  auth_endpoint: api/auth

# Lets you edit offline on your PC: run "npm run cms" and "npm run dev", then open http://localhost:4321/admin/
local_backend: true

site_url: https://senthilmuthiah.com
display_url: https://senthilmuthiah.com
locale: en

media_folder: public/images/posts
public_folder: /images/posts

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    sortable_fields: [date, title]
    summary: "{{title}} — {{date}}"
    preview_path: "blog/{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Publish date and time, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { name: summary, label: Short summary (shown in lists and search results), widget: text, required: false }
      - { name: tags, label: Tags, widget: list, default: [], hint: "e.g. EMR, PMS, LIS, Billing, EDI, Java" }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: draft, label: Draft (hide from site), widget: boolean, default: true }
      - name: faq
        label: FAQ (shown at the bottom of the post, and to Google)
        label_singular: Question
        widget: list
        required: false
        summary: "{{fields.q}}"
        fields:
          - { name: q, label: Question, widget: string }
          - { name: a, label: Answer, widget: text }
      - { name: body, label: Post, widget: markdown }
